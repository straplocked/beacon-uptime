name: Build and Push Docker Image

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        env:
          # docker/metadata-action's `tags` output is newline-separated.
          # Passing it through an env var (rather than interpolating
          # ${{ steps.meta.outputs.tags }} directly into the script) avoids
          # GitHub Actions splicing that multi-line value into the run
          # script as literal text, which breaks `for tag in ...; do`
          # syntax whenever there's more than one tag.
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build .
          while IFS= read -r tag; do
            [ -n "$tag" ] && docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build "$tag"
          done <<< "$TAGS"
          docker push --all-tags ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
