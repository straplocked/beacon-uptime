# Beacon's own three processes. Always present — postgres.conf and
# redis.conf are generated into this same conf.d/ directory by
# entrypoint.sh, only when the embedded service is actually needed (i.e.
# DATABASE_URL / REDIS_URL was not overridden to point elsewhere).
#
# No ordering dependency between these three and the embedded services:
# the entrypoint runs migrations to completion (against a database it has
# already started and waited on) before exec'ing supervisord, so by the
# time supervisord starts anything, the database is already up and
# migrated. autorestart keeps each process alive across transient errors.

[program:app]
command=node server.js
directory=/app
user=nextjs
environment=HOME="/tmp"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30

[program:worker]
command=node dist/worker/index.js
directory=/app
user=nextjs
environment=HOME="/tmp"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30

[program:scheduler]
command=node dist/worker/scheduler.js
directory=/app
user=nextjs
environment=HOME="/tmp"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30
